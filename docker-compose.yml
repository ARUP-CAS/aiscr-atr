# Hlavní služba + kontejnery s modely. Modely na GPU jsou v profilu `gpu`,
# volitelné v profilech `alt` a `pageclass`:
#   docker compose up atr-api                 # jen služba (vývoj s adaptéry fake)
#   docker compose --profile gpu up           # služba + rozvržení + PaddleOCR-VL
#   docker compose --profile gpu --profile alt up   # + GLM-OCR

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  atr-api:
    build: .
    image: ghcr.io/arup-cas/aiscr-atr:dev
    ports: ["8080:8000"]
    environment:
      ATR_CONFIG: /app/config/pipeline.yaml
    volumes:
      - ./config:/app/config:ro

  layout:
    profiles: [gpu]
    build: models/layout-ppdoclayoutv3
    image: ghcr.io/arup-cas/aiscr-atr-layout-ppdoclayoutv3:dev
    volumes: [hf-cache:/root/.cache/huggingface]
    <<: *gpu

  ocr-text:
    profiles: [gpu]
    image: ${VLLM_IMAGE:-vllm-image-not-set}
    command: >-
      --model PaddlePaddle/PaddleOCR-VL-1.6
      --served-model-name PaddlePaddle/PaddleOCR-VL-1.6
      --trust-remote-code --max-num-seqs 64 --gpu-memory-utilization 0.5
    volumes: [hf-cache:/root/.cache/huggingface]
    <<: *gpu

  ocr-alt:
    profiles: [alt]
    image: ${VLLM_IMAGE:-vllm-image-not-set}
    command: >-
      --model zai-org/GLM-OCR --served-model-name zai-org/GLM-OCR
      --max-num-seqs 64 --gpu-memory-utilization 0.4
    volumes: [hf-cache:/root/.cache/huggingface]
    <<: *gpu

  pageclass:
    profiles: [pageclass]
    build: models/pageclass-vit
    image: ghcr.io/arup-cas/aiscr-atr-pageclass-vit:dev
    volumes: [hf-cache:/root/.cache/huggingface]

volumes:
  hf-cache:
