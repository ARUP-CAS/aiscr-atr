# Hlavní služba + kontejnery s modely. Modely na GPU jsou v profilu `gpu`,
# volitelný druhý model v profilu `alt`:
#   docker compose up atr-api layout          # služba + rozvržení na CPU
#   docker compose --profile gpu up           # + PaddleOCR-VL (GPU)
#   docker compose --profile gpu --profile alt up   # + GLM-OCR
#
# Bez NVIDIA (AMD/Intel přes Vulkan, llama.cpp) – jen nativní Docker engine, ne Docker Desktop,
# protože ten GPU do kontejneru nepustí. Modely GGUF stáhne scripts/fetch-gguf.sh:
#   OCR_TEXT_URL=http://ocr-text-vulkan:8000/v1 docker --context default compose --profile vulkan up

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  atr-api:
    build: .
    depends_on:
      layout: {condition: service_healthy}
    image: ghcr.io/arup-cas/aiscr-atr:dev
    ports: ["8080:8000"]
    environment:
      ATR_CONFIG: /app/config/pipeline.yaml
      OCR_TEXT_URL: ${OCR_TEXT_URL:-http://ocr-text:8000/v1}
      OCR_ALT_URL: ${OCR_ALT_URL:-http://ocr-alt:8000/v1}
      HANDWRITING_RECOGNIZER: ${HANDWRITING_RECOGNIZER:-paddle-text}
      ATR_MAX_UPLOAD_MB: ${ATR_MAX_UPLOAD_MB:-1024}
      ATR_MAX_CONCURRENT: ${ATR_MAX_CONCURRENT:-2}
    volumes:
      - ./config:/app/config:ro

  layout:
    # ONNX Runtime na CPU (~0,6 s na stranu, obraz bez PyTorch). Pro GPU varianta
    # s PyTorch: dockerfile Dockerfile, build arg TORCH_INDEX a blok `deploy` jako u ocr-text.
    build:
      context: models/layout-ppdoclayoutv3
      dockerfile: Dockerfile.onnx
    image: ghcr.io/arup-cas/aiscr-atr-layout-ppdoclayoutv3:dev-onnx
    environment:
      THRESHOLD: "0.3"
      DEDUPE_IOU: "0.9"

  ocr-text:
    profiles: [gpu]
    image: ${VLLM_IMAGE:-vllm-image-not-set}
    command: >-
      --model PaddlePaddle/PaddleOCR-VL-1.6
      --revision 132c45f52c0a26ed5a6b2f6bd8e3985794cc27dd
      --code-revision 132c45f52c0a26ed5a6b2f6bd8e3985794cc27dd
      --served-model-name PaddlePaddle/PaddleOCR-VL-1.6
      --trust-remote-code --max-num-seqs 64 --gpu-memory-utilization 0.5
    volumes: [hf-cache:/root/.cache/huggingface]
    <<: *gpu

  ocr-alt:
    profiles: [alt]
    image: ${VLLM_IMAGE:-vllm-image-not-set}
    command: >-
      --model zai-org/GLM-OCR --revision 2e85a62840ccac27daa451df36c736c4636b8628
      --served-model-name zai-org/GLM-OCR
      --max-num-seqs 64 --gpu-memory-utilization 0.4
    volumes: [hf-cache:/root/.cache/huggingface]
    <<: *gpu

  ocr-text-vulkan:
    profiles: [vulkan]
    image: ghcr.io/ggml-org/llama.cpp@sha256:5c73025f2072135ad37e306db9a57c685d8a349cfa5cb82b5c0f385b97567c94  # server-vulkan
    command: >-
      -m /models/paddleocr-vl-1.6/model.gguf --mmproj /models/paddleocr-vl-1.6/mmproj.gguf
      --host 0.0.0.0 --port 8000 --temp 0 -ngl 99 -c 16384 --parallel 4
    devices: [/dev/dri]
    group_add: [video, render]
    volumes: ["${GGUF_DIR:-~/.cache/aiscr-atr/gguf}:/models:ro"]

  ocr-alt-vulkan:
    profiles: [vulkan-alt]
    image: ghcr.io/ggml-org/llama.cpp@sha256:5c73025f2072135ad37e306db9a57c685d8a349cfa5cb82b5c0f385b97567c94  # server-vulkan
    command: >-
      -m /models/glm-ocr/model.gguf --mmproj /models/glm-ocr/mmproj.gguf
      --host 0.0.0.0 --port 8000 --temp 0 -ngl 99 -c 16384 --parallel 4
    devices: [/dev/dri]
    group_add: [video, render]
    volumes: ["${GGUF_DIR:-~/.cache/aiscr-atr/gguf}:/models:ro"]

volumes:
  hf-cache:
