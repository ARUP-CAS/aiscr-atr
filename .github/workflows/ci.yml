name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Písma pro testovací vzorky (čeština)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Instalace
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check atr samples scripts training models
      - name: Testy
        run: pytest -q
      - name: OpenAPI odpovídá kódu
        run: python scripts/export_openapi.py --check
      - name: docker compose je platný
        run: docker compose config -q
