[project]
name = "aiscr-atr"
version = "0.1.0.dev0"
description = "Otevřená služba ATR: rozvržení a text dokumentů do atr/docproc-json"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "lingua-language-detector>=2.1,<3",
    "pillow>=11,<13",
    "pypdf>=5,<8",
    "pypdfium2>=5,<6",
    "python-multipart>=0.0.9",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4,<5"]
training = ["pyarrow>=17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atr"]

[tool.pytest.ini_options]
testpaths = ["atr/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"atr/api/*" = ["B008"]  # File()/Form() ve výchozích hodnotách je vzor FastAPI
